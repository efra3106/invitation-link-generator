<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Buat link undangan digital dan pesan WhatsApp siap kirim dengan cepat.">
  <meta name="theme-color" content="#7a4e5c">
  <title>Invitation Link Generator</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <main class="app">

    <header class="app-header">
      <p class="eyebrow">Grazinia · 5th Birthday</p>
      <h1>Invitation Link Generator</h1>
      <p class="subtitle">Buat link undangan &amp; pesan WhatsApp dengan cepat</p>
      <p class="hint">Masukkan nama tamu, lalu buat link undangan siap dibagikan.</p>
    </header>

    <section class="card" aria-labelledby="guestNameLabel">
      <form id="guestForm" action="#" novalidate onsubmit="return false;">
        <label id="guestNameLabel" for="guestName" class="field-label">Nama Tamu</label>

        <input
          id="guestName"
          class="text-input"
          type="text"
          placeholder="Masukkan nama tamu..."
          autocomplete="off"
          autocapitalize="words"
          spellcheck="false"
          enterkeyhint="go"
          aria-describedby="errorMessage"
        >

        <p id="errorMessage" class="error-message" role="alert" aria-live="assertive"></p>

        <button id="createLinkButton" type="submit" class="btn btn-primary">
          CREATE LINK
        </button>
      </form>
    </section>

    <section id="resultSection" class="card result hidden" aria-live="polite" aria-labelledby="guestPreviewLabel">

      <div class="guest-preview">
        <span id="guestPreviewLabel" class="preview-label">Undangan untuk</span>
        <strong id="guestPreview" class="preview-name"></strong>
      </div>

      <div class="block">
        <label for="invitationUrl" class="field-label">LINK UNDANGAN</label>
        <div class="url-box">
          <input id="invitationUrl" class="url-input" type="text" readonly>
        </div>
        <button id="copyLinkButton" type="button" class="btn btn-outline">
          COPY LINK
        </button>
      </div>

      <div class="block">
        <label for="whatsappMessage" class="field-label">PESAN WHATSAPP</label>
        <textarea
          id="whatsappMessage"
          class="message-input"
          rows="18"
          spellcheck="false"
        ></textarea>
        <p class="small-note">Pesan dapat diedit sebelum dikirim.</p>

        <div class="btn-row">
          <button id="shareWhatsappButton" type="button" class="btn btn-whatsapp">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91A9.86 9.86 0 0 0 12.04 2Zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.23 8.23 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24a8.24 8.24 0 0 1 8.24 8.25c0 4.54-3.7 8.23-8.24 8.23Zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.24-.64.8-.78.97-.14.16-.29.18-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.43.13-.15.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48a.92.92 0 0 0-.66.31c-.23.25-.87.85-.87 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.24 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.06-.1-.22-.16-.47-.28Z"/>
            </svg>
            SHARE TO WHATSAPP
          </button>
          <button id="copyTextButton" type="button" class="btn btn-outline">
            COPY TEXT
          </button>
        </div>
      </div>

      <button id="resetButton" type="button" class="btn btn-ghost">
        RESET
      </button>

    </section>

    <footer class="app-footer">
      <p>Link menuju <span class="mono">efra3106.github.io/Undanga-Grazinia</span></p>
    </footer>

  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js?v=2"></script>
</body>
</html>
